# fly.toml app configuration file generated for guatson-ai-bot on 2026-09-19T23:00:53Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'guatson-ai-bot'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

# PLACEHOLDER: replace with your actual Fly.io app name for staging
# (create it first with `flyctl apps create <name> --org <org>`).
app = "guatson-bot-ai-staging"
primary_region = "scl"

[build]

[env]
  APP_ENV = "staging"
  PORT = "8080"

[deploy]
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/health/ready"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

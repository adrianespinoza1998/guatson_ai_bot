services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guatson}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-guatson}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guatson} -d ${POSTGRES_DB:-guatson}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: runs the migrations and exits. `app` and `bot-polling` both wait on it
  # (service_completed_successfully) instead of each running `alembic upgrade head`
  # themselves — doing that concurrently races on the very first migration (both try
  # to CREATE TABLE alembic_version) when the `polling` profile brings both up at once.
  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-guatson}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@db:5432/${POSTGRES_DB:-guatson}
    volumes:
      - ./migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy

  # Webhook mode: what runs in staging/production. Locally it just serves
  # /webhook/telegram and /health*; nothing calls it unless you point a real webhook
  # at it (e.g. via a tunnel), so it coexists fine with `bot-polling` below.
  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-guatson}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@db:5432/${POSTGRES_DB:-guatson}
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Development mode: long-polling, no public URL required. Start with
  # `docker compose --profile polling up`.
  bot-polling:
    build: .
    profiles: ["polling"]
    command: python scripts/run_polling.py
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-guatson}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@db:5432/${POSTGRES_DB:-guatson}
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db_data:
